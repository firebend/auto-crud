# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      include: scope
      prefix: "fix: "
    # Framework-aligned packages are versioned per target framework in Directory.Packages.props.
    # A new major version means a new target framework block, which is added by hand.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.Authentication.JwtBearer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.JsonPatch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.Mvc.NewtonsoftJson"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      include: scope
      prefix: "chore: "
